[project]
name = "openevalz-eval-drop"
version = "0.1.0"
description = "OpenEvalz packaging of DROP: A Reading Comprehension Benchmark Requiring Discrete Reasoning Over Paragraphs"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router-py>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "drop"
execution_class = "plain"
cost_class = "medium"
